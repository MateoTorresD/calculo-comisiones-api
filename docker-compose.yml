services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comisiones
      POSTGRES_PASSWORD: comisiones_dev
      POSTGRES_DB: comisiones
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comisiones -d comisiones']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
